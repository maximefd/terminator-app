<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curateur — Terminator</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>🧩 Curateur du lexique</h1>
    <p>Triez les mots du dictionnaire de Terminator, une carte à la fois.</p>
    <form id="login-form">
      <label for="pin">Code PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary">Entrer</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
