name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt
          pip install ruff==0.16.7 pytest-cov==7.1.0

      - name: Lint Python (ruff)
        run: |
          source .venv/bin/activate
          ruff check backend tools

      - name: Audit Python dependencies (pip-audit)
        run: |
          source .venv/bin/activate
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r tools/curator/requirements.txt

      # Couverture minimale : 80 % sur le moteur, 70 % sur les outils (voir docs/ROADMAP.md)
      - name: Run backend tests with pytest
        run: |
          source .venv/bin/activate
          pytest -vv --showlocals backend/tests/ --cov=backend/engine --cov-report=term --cov-fail-under=80

      - name: Check layouts catalog
        run: |
          source .venv/bin/activate
          python backend/check_layouts.py

      - name: Run tools tests (lexicon pipeline)
        run: |
          source .venv/bin/activate
          pytest -v tools/ --cov=tools --cov-report=term --cov-fail-under=70

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Doit savoir lire le lockfile v9 (pnpm 8 ne le peut pas)
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint frontend
        run: cd frontend && pnpm lint

      - name: Type-check frontend
        run: cd frontend && pnpm exec tsc --noEmit
      
      - name: Build frontend
        run: cd frontend && pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5001