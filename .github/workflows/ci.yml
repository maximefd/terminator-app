name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt
          pip install ruff==0.16.7 pytest-cov==7.1.0

      - name: Lint Python (ruff)
        run: |
          source .venv/bin/activate
          ruff check backend tools

      - name: Audit Python dependencies (pip-audit)
        run: |
          source .venv/bin/activate
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r tools/curator/requirements.txt

      # Couverture minimale : 80 % sur le moteur, 70 % sur les outils (voir docs/ROADMAP.md)
      - name: Run backend tests with pytest
        run: |
          source .venv/bin/activate
          pytest -vv --showlocals backend/tests/ --cov=backend/engine --cov-report=term --cov-fail-under=80

      - name: Check layouts catalog
        run: |
          source .venv/bin/activate
          python backend/check_layouts.py

      - name: Run tools tests (lexicon pipeline)
        run: |
          source .venv/bin/activate
          pytest -v tools/ --cov=tools --cov-report=term --cov-fail-under=70

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Doit savoir lire le lockfile v9 (pnpm 8 ne le peut pas)
          # Version exacte : « 12 » prend la dernière, et pnpm 12.6.0 (23/09/2026) bloque `pnpm dev` lancé
          # par Playwright, qui attendait sans fin. Monter en connaissance de cause (Dependabot n'y touche pas).
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # Comme pip-audit côté Python : une vulnérabilité connue dans une dépendance livrée arrête la CI (#122)
      - name: Audit frontend dependencies (pnpm audit)
        run: cd frontend && pnpm audit --prod

      - name: Lint frontend
        run: cd frontend && pnpm lint

      - name: Type-check frontend
        run: cd frontend && pnpm exec tsc --noEmit
      
      - name: Build frontend
        run: cd frontend && pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5001

  secrets-ci:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Les commits de la PR, ou ceux poussés sur main ; exceptions dans .gitleaks.toml (#122)
      - name: Chercher des secrets dans les nouveaux commits
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          docker run --rm -v "$PWD":/repo --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            "git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact --config /repo/.gitleaks.toml --log-opts='$LOG_OPTS'"

  e2e-ci:
    name: Parcours end-to-end et accessibilité (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dev : `next dev`. static : le site tel qu'il est publié, l'export (`out/` et `out/_headers`) servi comme
        # par Cloudflare Pages (#121) ; c'est là seulement que la CSP par page existe (`csp.spec.ts`)
        site: [dev, static]
    # D'habitude 2 à 3 minutes : un blocage doit échouer vite, pas occuper le runner six heures
    timeout-minutes: 20

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: terminator
          POSTGRES_PASSWORD: terminator
          POSTGRES_DB: terminator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terminator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Boîte de réception de test : les parcours y lisent les e-mails du compte (ADR 0014)
      mail:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start the API
        working-directory: backend
        env:
          PORT: 5001
          DATABASE_URL: postgresql://terminator:terminator@localhost:5432/terminator_test
          SECRET_KEY: ci-secret-key-long-enough-for-tests-only
          JWT_SECRET_KEY: ci-jwt-secret-key-long-enough-for-tests-only
          # Les parcours créent un compte par exécution : le quota de production (5 par heure)
          # les ferait échouer dès le deuxième test.
          RATELIMIT_REGISTER: 1000 per hour
          LEXICON_RELOAD_INTERVAL_S: 0
          MAIL_BACKEND: smtp
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          FRONTEND_URL: http://localhost:3000
        run: |
          nohup python run.py > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/api/status > /dev/null; then
              echo "API prête"; exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas démarré :"; cat /tmp/api.log; exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version exacte : « 12 » prend la dernière, et pnpm 12.6.0 (23/09/2026) bloque `pnpm dev` lancé
          # par Playwright, qui attendait sans fin. Monter en connaissance de cause (Dependabot n'y touche pas).
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Build the static export
        if: matrix.site == 'static'
        run: cd frontend && pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5001

      - name: Run end-to-end and accessibility tests
        run: cd frontend && pnpm exec playwright test
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5001
          PLAYWRIGHT_STATIC: ${{ matrix.site == 'static' && '1' || '' }}

      - name: Journal de l'API en cas d'échec
        if: failure()
        run: cat /tmp/api.log

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.site }}
          path: frontend/playwright-report/
          retention-days: 7
