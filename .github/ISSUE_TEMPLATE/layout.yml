name: 🧩 Nouveau layout
description: Proposer une mise en page de grille recopiée d'un magazine ou d'un cahier de mots fléchés
labels: [layouts]
body:
  - type: textarea
    id: grid
    attributes:
      label: Grille
      description: "Une ligne par rangée : x = case définition, - = case lettre. Le format (largeur × hauteur) se déduit de la grille."
      render: text
      placeholder: |
        x-x-x-
        ------
        x-----
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
