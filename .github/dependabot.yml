version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [ci, backend]

  - package-ecosystem: pip
    directory: /tools/curator
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [ci, lexique]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [ci, frontend]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Image de base de l'API (python:3.11-slim)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [ci, backend]

  # Images de docker-compose.prod.yml (PostgreSQL, cloudflared)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    labels: [ci, backend]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ci]
